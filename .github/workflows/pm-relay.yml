name: pm-relay

# Polymarket → 静态 JSON 中继
# 为什么存在：本机（及 CN 网络）到 gamma-api / clob / data-api 三个域名 DNS 污染 + TCP 超时，
# 实测 5 个公网中继全灭、本机无代理。GitHub 侧可直连，故由 Actions 抓取并 commit 到 relay/，
# 本机用 sync-relay.ps1 走 raw.githubusercontent 拉取（公网读取不需要 token）。
#
# 频率：每 30 分钟。序列抓取有上限（--series-cap），不会把他家 API 打爆。
# 手动触发：Actions → pm-relay → Run workflow（debug=true 只抓市场不抓序列）

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "只抓市场列表，不抓价格序列"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: pm-relay
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        run: |
          ARGS="--out relay --max-markets 1800 --series-cap 60"
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then ARGS="$ARGS --no-series"; fi
          python relay/fetch_pm.py $ARGS

      - name: Commit
        run: |
          git config user.name  "pm-relay-bot"
          git config user.email "pm-relay-bot@users.noreply.github.com"
          git add relay/markets.json relay/series.json relay/meta.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "relay: $(date -u +%Y-%m-%dT%H:%MZ) n=$(python -c "import json;print(json.load(open('relay/meta.json'))['n_markets'])")"
            git push
          fi
